name: Compatibility and race tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build container
        run: docker build -t breakmock:ci .
      - name: Check container license notices
        run: docker run --rm breakmock:ci --licenses > /tmp/breakmock-licenses.txt && grep -F 'Copyright (c) 2014 Shopify' /tmp/breakmock-licenses.txt
      - name: Test embedded Toxiproxy executable
        run: |
          go build -o bin/breakmock ./cmd/breakmock
          python3 scripts/toxiproxy_integration.py --binary bin/breakmock
      - name: Download pinned Java reference
        run: |
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/org/wiremock/wiremock-standalone/4.0.0-beta.40/wiremock-standalone-4.0.0-beta.40.jar -o /tmp/wiremock.jar
          echo '3a53dec6c814ff73da4abb0bc51624215ea2b913beec8d19aa6d54e4c62161d3  /tmp/wiremock.jar' | sha256sum --check
      - name: Compare against Java WireMock
        id: go_compatibility
        run: python3 scripts/verify.py --jar /tmp/wiremock.jar
      - name: Compare against Java with embedded Toxiproxy disabled
        if: ${{ !cancelled() && steps.go_compatibility.outcome != 'skipped' }}
        run: python3 scripts/verify.py --jar /tmp/wiremock.jar --candidate-arg=--enable-toxiproxy=false --output-dir testdata/reports/toxiproxy/compatibility-disabled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-reports
          path: testdata/reports/
