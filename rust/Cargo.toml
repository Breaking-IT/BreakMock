[package]
name = "breakmock-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
httparse = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
regex = "1"
fancy-regex = "0.16"
chrono = "0.4"
handlebars = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

jsonpath-rust = "1"
roxmltree = "0.20"
sxd-document = "0.3"
sxd-xpath = "0.4"
jsonschema = { version = "0.33", default-features = false }
bigdecimal = "0.4"
percent-encoding = "2"
rand = "0.9"
sha2 = "0.10"
md-5 = "0.10"
chrono-tz = "0.10"

socket2 = "0.6"

encoding_rs = "0.8"

sha1 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
